<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục với display</title>
    <!-- Liên kết tới file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề h1 theo yêu cầu -->
    <h1>Bố cục trang web với display</h1>

    <!-- Thanh điều hướng nav chứa 4 liên kết -->
    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Dịch vụ</a>
        <a href="#">Liên hệ</a>
    </nav>

    <!-- Khối section chứa 3 cột hiển thị theo dạng inline-block -->
    <section>
        <div class="box">
            <h3>Cột 1</h3>
            <p>Nội dung mô tả cho cột thứ nhất.</p>
        </div><div class="box">
            <h3>Cột 2</h3>
            <p>Nội dung mô tả cho cột thứ hai.</p>
        </div><div class="box">
            <h3>Cột 3</h3>
            <p>Nội dung mô tả cho cột thứ ba.</p>
        </div>
    </section>

    <!-- Footer ở cuối trang -->
    <footer>
        <p>Bản quyền &copy; 2026</p>
    </footer>

</body>
</html>
